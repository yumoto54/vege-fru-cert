<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>認定レストラン確認 | 日本野菜ソムリエ協会</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Hiragino Kaku Gothic ProN', sans-serif; background: #f5f0e8; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: white; border-radius: 8px; box-shadow: 0 4px 24px rgba(0,0,0,0.10); max-width: 480px; width: 100%; padding: 40px 36px; text-align: center; }
    .logo { font-size: 13px; color: #888; letter-spacing: 0.1em; margin-bottom: 24px; }
    .icon { font-size: 48px; margin-bottom: 16px; }
    p { color: #666; font-size: 14px; line-height: 1.8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">日本野菜ソムリエ協会</div>
    <div class="icon">🔄</div>
    <p>転送中です。しばらくお待ちください...</p>
  </div>
  <script>
    const sb = window.supabase.createClient(
      'https://chahhgdyjkjzzbiyvdsk.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNoYWhoZ2R5amtqenpiaXl2ZHNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4OTM3NzksImV4cCI6MjEwMTQ2OTc3OX0.B48Bv0HXb3KRjplLgc0Gmm_iVE-Ni8LD9OjZkLshfXw'
    );
    async function load() {
      const id = new URLSearchParams(location.search).get('id') || '';
      const icon = document.querySelector('.icon');
      const msg  = document.querySelector('p');
      if (!id || id.length < 10) { icon.textContent='❌'; msg.textContent='無効なURLです。'; return; }
      const { data, error } = await sb.from('restaurant_certificates').select('*').eq('id', id).single();
      if (error || !data) { icon.textContent='❌'; msg.textContent='認定情報が見つかりません。'; return; }
      const today = new Date(); today.setHours(0,0,0,0);
      const isValid = new Date(data.valid_until) >= today;
      if (!isValid) { icon.textContent='⚠️'; msg.textContent=data.restaurant_name+' の認定有効期限は終了しています。'; return; }
      if (data.redirect_url) {
        location.href = data.redirect_url;
      } else {
        icon.textContent='🏅';
        msg.innerHTML='<strong>'+data.restaurant_name+'</strong><br>日本野菜ソムリエ協会 認定店<br><br>有効期限: '+new Date(data.valid_until).toLocaleDateString('ja-JP')+'まで';
      }
    }
    load();
  </script>
</body>
</html>
